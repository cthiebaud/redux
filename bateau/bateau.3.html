<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:description" content="Partition complète (paroles et musique) du « Bateau ivre » d’Arthur Rimbaud, mis en musique par Christophe Thiebaud.">
<meta property="og:url" content="https://redux.cthiebaud.com/bateau/bateau.3.html">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Le Bateau ivre">
<meta name="twitter:description" content="Partition complète (paroles et musique) du « Bateau ivre » d’Arthur Rimbaud, mis en musique par Christophe Thiebaud.">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container py-5" id="score"></div>
  <script>
    fetch('bateau.3.web.svg')
      .then(r => r.text())
      .then(svgText => {
        const container = document.getElementById('score');
        container.innerHTML = svgText;
        const svg = container.querySelector('svg');

        // bateau.3.web.svg is built on a deliberately oversized page
        // (see build-web-svg.sh): LilyPond glues the footer
        // (footnote + copyright + tagline) to the bottom margin of
        // whatever height it's given, not to where the content ends,
        // leaving a big gap in between. Find the footer by its own
        // footnote separator rule -- a plain horizontal line starting
        // exactly at x=0 -- then pull everything from there to the
        // end of the document up to sit right after the real content,
        // and crop to what's left via getBBox().
        const desiredGap = 6;
        let footerStart = null;
        for (const line of svg.querySelectorAll('line')) {
          if (
            parseFloat(line.getAttribute('x1')) === 0 &&
            parseFloat(line.getAttribute('y1')) === 0 &&
            parseFloat(line.getAttribute('y2')) === 0
          ) {
            const m = /translate\(([-\d.]+),\s*([-\d.]+)\)/.exec(
              line.parentElement.getAttribute('transform') || ''
            );
            if (m) footerStart = line.parentElement; // last match wins
          }
        }

        if (footerStart) {
          const footerNodes = [];
          for (let n = footerStart; n; n = n.nextElementSibling) footerNodes.push(n);
          const contentNodes = Array.from(svg.children).filter(
            n => !footerNodes.includes(n)
          );

          // getBBox() excludes an element's own transform attribute, so
          // measuring each footerNode directly would drop its real
          // position. Measuring from the root instead -- hiding the
          // other side each time -- picks up every descendant's
          // transform correctly.
          footerNodes.forEach(n => (n.style.display = 'none'));
          const contentBox = svg.getBBox();
          footerNodes.forEach(n => (n.style.display = ''));

          contentNodes.forEach(n => (n.style.display = 'none'));
          const footerBox = svg.getBBox();
          contentNodes.forEach(n => (n.style.display = ''));

          const shift = footerBox.y - (contentBox.y + contentBox.height) - desiredGap;
          if (shift > 0) {
            const wrapper = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            wrapper.setAttribute('transform', `translate(0, ${-shift})`);
            footerNodes.forEach(n => wrapper.appendChild(n));
            svg.appendChild(wrapper);
          }
        }

        const pad = 2;
        const box = svg.getBBox();
        svg.setAttribute(
          'viewBox',
          `${box.x - pad} ${box.y - pad} ${box.width + 2 * pad} ${box.height + 2 * pad}`
        );
        svg.removeAttribute('width');
        svg.removeAttribute('height');
        svg.classList.add('img-fluid', 'd-block', 'mx-auto');

        // --- Temporary diagnostic: chord-name distance from its staff's
        // bottom line. Chord-root glyphs (ChordName's font-size, 2.6162
        // in this build) are bolded and the bottom line of each staff
        // they're linked to is thickened, purely so the two can be
        // visually matched up against the printed numbers below --
        // superscripts (a different, smaller font-size) are left alone.
        const CHORD_ROOT_FONT_SIZE = '2.6162';
        const SECTION_WORDS = new Set(['Intro', 'Vamp', 'Sequence', 'Climax', 'Outro']);

        function groupTranslate(el) {
          const m = /translate\(([-\d.]+),\s*([-\d.]+)\)/.exec(
            el.parentElement.getAttribute('transform') || ''
          );
          return m ? { x: parseFloat(m[1]), y: parseFloat(m[2]) } : null;
        }

        // Collect every horizontal staff line as {x, y}, y being the
        // line's absolute position (group translate-y + the line's own
        // y1, since y1 === y2 for a horizontal line but isn't always 0).
        // Fret-diagram grid lines are also plain horizontal <line>
        // elements, evenly spaced like staff lines -- excluded here by
        // length, since a staff line spans the whole system width while
        // a fret-diagram's is only a few units (the width of the box).
        const MIN_STAFF_LINE_LENGTH = 20;
        const staffLines = [];
        for (const line of svg.querySelectorAll('line')) {
          const y1 = parseFloat(line.getAttribute('y1'));
          const y2 = parseFloat(line.getAttribute('y2'));
          if (Math.abs(y1 - y2) > 1e-6) continue;
          const x1 = parseFloat(line.getAttribute('x1'));
          const x2 = parseFloat(line.getAttribute('x2'));
          if (Math.abs(x2 - x1) < MIN_STAFF_LINE_LENGTH) continue;
          const t = groupTranslate(line);
          if (!t) continue;
          staffLines.push({ x: t.x, y: t.y + y1, el: line });
        }

        // Cluster lines into staves: groups of >=3 lines, 1 staff-space
        // apart, sharing the same x start.
        const staves = [];
        const used = new Array(staffLines.length).fill(false);
        const byXY = [...staffLines].sort((a, b) => a.x - b.x || a.y - b.y);
        for (let i = 0; i < byXY.length; i++) {
          if (used[i]) continue;
          const group = [byXY[i]];
          used[i] = true;
          for (let j = i + 1; j < byXY.length; j++) {
            if (used[j]) continue;
            if (Math.abs(byXY[j].x - byXY[i].x) < 0.5 &&
                group.some(g => Math.abs(byXY[j].y - g.y - 1.0) < 0.15)) {
              group.push(byXY[j]);
              used[j] = true;
            }
          }
          if (group.length >= 3) {
            const bottom = group.reduce((a, b) => (a.y > b.y ? a : b));
            staves.push({ x: byXY[i].x, bottom });
          }
        }

        // Chord-root glyphs: bold them, then for each find its nearest
        // staff bottom (the closest one strictly above it) and thicken
        // that line.
        const results = [];
        for (const text of svg.querySelectorAll(`text[font-size="${CHORD_ROOT_FONT_SIZE}"]`)) {
          const tspan = text.querySelector('tspan');
          const label = tspan ? tspan.textContent : '';
          if (SECTION_WORDS.has(label)) continue;
          text.style.fontWeight = '900';

          const t = groupTranslate(text);
          if (!t) continue;
          let nearest = null;
          for (const s of staves) {
            if (s.bottom.y < t.y && (!nearest || s.bottom.y > nearest.bottom.y)) nearest = s;
          }
          if (!nearest) continue;
          nearest.bottom.el.style.strokeWidth = '0.5';
          results.push({ label, distance: t.y - nearest.bottom.y });
        }

        console.log('Chord name distance from its staff\'s bottom line (staff-spaces):');
        console.table(results);
      });
  </script>
</body>
</html>
